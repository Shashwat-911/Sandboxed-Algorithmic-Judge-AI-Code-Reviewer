<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workshop task board</title><style>body{font:16px system-ui;background:#edf1f7;color:#19202d;margin:0;padding:60px 24px}main{max-width:600px;margin:auto;background:white;border-radius:18px;padding:40px;box-shadow:0 20px 80px #27385c12}small{color:#6452da;letter-spacing:2px}h1{font-size:36px;letter-spacing:-1.5px}p{color:#737e91}form{display:flex;gap:10px}input[type=text]{padding:14px;border:1px solid #d5dae5;border-radius:8px;flex:1;min-width:0;font:inherit}button{background:#5845d6;color:white;border:0;border-radius:8px;padding:14px;cursor:pointer}li{padding:16px 0;border-bottom:1px solid #eee;list-style:none}ul{padding:0}input[type=checkbox]{margin-right:12px;accent-color:#5845d6}label:has(:checked){text-decoration:line-through;color:#838b99}</style></head><body><main><small>PLAYWRIGHT WORKSHOP / DEMO TARGET</small><h1>Make room for progress.</h1><p>A small task board for your first browser journey.</p><form id="form"><input id="task" type="text" aria-label="New task" placeholder="What will you build?" required><button id="add">Add task</button></form><ul id="tasks"></ul><p id="count" aria-live="polite">0 completed</p></main><script>document.querySelector('#form').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#task');if(!input.value.trim())return;const li=document.createElement('li'),label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';label.append(check,document.createTextNode(input.value.trim()));li.append(label);document.querySelector('#tasks').append(li);input.value='';check.onchange=()=>{document.querySelector('#count').textContent=document.querySelectorAll('#tasks input:checked').length+' completed'};console.info('Task added')};</script></body></html>
